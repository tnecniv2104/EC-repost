name: Eyescandy Reposter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eyescandy-reposter
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto

      - name: Run Eyescandy Reposter
        env:
          EYESCANDY_PASSWORD: ${{ secrets.EYESCANDY_PASSWORD }}
        run: python eyescandy_reposter.py

      - name: Save state file
        if: always()
        run: |
          if [ -f eyescandy_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add eyescandy_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Eyescandy reposter state"
              git push
            else
              echo "Geen wijzigingen in statebestand."
            fi
          else
            echo "Geen statebestand gevonden; niets opgeslagen."
          fi
