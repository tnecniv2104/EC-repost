name: Eyescandy Reposter RUN 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyescandy-reposter-state
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install atproto

      - name: Restore Eyescandy state
        uses: actions/cache/restore@v4
        with:
          path: eyescandy_state.json
          key: ${{ runner.os }}-eyescandy-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-eyescandy-state-

      - name: Run Eyescandy RUN_2
        env:
          EYESCANDY_PASSWORD: ${{ secrets.EYESCANDY_PASSWORD }}
          RUN_MODE: "RUN_2"
        run: python eyescandy_reposter.py

      - name: Save Eyescandy state
        if: always() && hashFiles('eyescandy_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: eyescandy_state.json
          key: ${{ runner.os }}-eyescandy-state-${{ github.run_id }}-${{ github.run_attempt }}
